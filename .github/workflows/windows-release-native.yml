name: Windows release qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Marionette driver
        run: python -m pip install --disable-pip-version-check --no-input marionette_driver==3.7.1
      - name: Qualify the signed Windows release and isolated profile customization
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        shell: pwsh
        run: |
          $edition = (Get-Content cyphra.json -Raw | ConvertFrom-Json).edition
          if ($edition -eq 'home') {
            'home=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            python tests/windows-home-native.py
          } else {
            'home=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            python tests/windows-release-native.py
          }
          exit $LASTEXITCODE
      - name: Preserve actual Home Windows qualification result
        if: ${{ always() && steps.qualify.outputs.home == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyphra-home-windows-native-${{ github.run_id }}
          path: ${{ runner.temp }}/cyphra-windows-home-native-proof.json
          if-no-files-found: warn
          retention-days: 14
