name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyphra-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: npm ci --ignore-scripts
      - name: Build matcher and verify compiled filter snapshots
        run: npm run bundle
      - name: Test filter, DNS, sync, news and signed-update policies
        run: npm test
      - name: Test Linux archive updates and rollback
        run: python3 -m unittest discover -s tests -p test_updates.py -v
      - name: Test strict OneCRL metadata envelopes without network access
        run: python3 -m unittest discover -s tests -p test_refresh_security_data.py -v
      - name: Test pinned Android engine overlay assembly and package guards
        run: python3 -m unittest discover -s tests -p test_android_engine_patch.py -v
      - name: Test native navigation safety supervisor without ADB or services
        run: python3 -m unittest discover -s tests -p test_android_navigation_safety.py -v
      - name: Test bounded navigation clock proofs without ADB or services
        run: python3 -m unittest discover -s tests -p test_android_navigation_clock.py -v
      - name: Test Home and security-edition native lifecycle proof boundaries without ADB
        run: python3 -m unittest discover -s tests -p test_android_native_lifecycle.py -v
      - name: Test local sync HTTP behavior and concurrent writes
        run: python3 tests/sync-server.test.py
      - name: Test Home Windows ownership and release identity refusals without running Windows
        run: python3 -m unittest discover -s tests -p test_windows_home_native.py -v
      - name: Check Python source syntax
        run: python3 -m compileall -q scripts server tests
